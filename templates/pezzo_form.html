{{define "content"}}
<div class="page-head">
<span class="overline">Repertorio</span>
<h1>Modifica pezzo</h1>
</div>
<section class="panel reveal">
<form method="post" action="/pezzi/{{.Piece.ID}}/modifica">
<div class="row">
<label>Compositore <input type="text" name="composer" value="{{.Piece.Composer}}" required></label>
<label>Opera <input type="text" name="work" value="{{.Piece.Work}}" required></label>
</div>
<div class="row">
<label>Movimento <input type="text" name="movement" value="{{.Piece.Movement}}"></label>
<label>Tipo
<select name="kind">
<option value="passo" {{if eq .Piece.Kind "passo"}}selected{{end}}>passo d'orchestra</option>
<option value="solo" {{if eq .Piece.Kind "solo"}}selected{{end}}>solistico</option>
</select></label>
</div>
<label>Estratto / battute <input type="text" name="excerpt" value="{{.Piece.Excerpt}}"></label>
<label>Difficoltà <input type="range" name="difficulty" min="1" max="5" step="1" value="{{if .Piece.Difficulty}}{{.Piece.Difficulty}}{{else}}3{{end}}" oninput="this.nextElementSibling.textContent=this.value"> <output>{{if .Piece.Difficulty}}{{.Piece.Difficulty}}{{else}}3{{end}}</output></label>
<fieldset><legend>Concorsi</legend>
{{range .Concorsi}}<div class="link-note"><label class="check"><input type="checkbox" name="concorso" value="{{.ID}}" {{if index $.Selected .ID}}checked{{end}}> {{.Name}}</label> <input type="text" name="nota-{{.ID}}" value="{{index $.Notes .ID}}" placeholder="nota per questo concorso"></div>{{end}}
</fieldset>
<div class="row btns">
<button type="submit">Salva</button>
<a class="btn secondary" href="/pezzi">Annulla</a>
</div>
</form>
</section>
{{end}}
